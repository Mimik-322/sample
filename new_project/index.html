<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UZB Jobs — быстрый старт</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
    .container{max-width:900px;margin:0 auto;padding:24px}
    .card{background:#111b35;border:1px solid #2a3b6b;border-radius:14px;padding:20px}
    h1{font-size:40px;line-height:1.1;margin:0 0 12px}
    p{color:#c9d5ff}
    .cta{display:inline-block;margin-top:12px;background:#36d788;color:#062515;padding:14px 20px;border-radius:10px;font-weight:700;text-decoration:none}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .item{background:#0c1430;border:1px solid #22315e;border-radius:10px;padding:12px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Подработка в Узбекистане<br>без опыта и резюме</h1>
      <p>Выходи на смену уже сегодня. Подбор вакансии за 15 минут, оплата — сразу после смены.</p>
      <a class="cta" href="https://t.me/" target="_blank" rel="noopener">Написать менеджеру</a>
      <div class="grid">
        <div class="item">Курьер</div>
        <div class="item">Разнорабочий</div>
        <div class="item">Охранник</div>
        <div class="item">Промоутер</div>
      </div>
    </section>
  </main>
</body>
</html>
